name: 'Preset Design System Check'
description: 'Validate PR code against your design system rules — AI slop detection, forbidden primitives, token misuse, and more'
author: 'presetai.dev'
branding:
  icon: 'check-circle'
  color: 'gray-dark'

inputs:
  github-token:
    description: 'GitHub token for PR comments and annotations'
    required: false
    default: ${{ github.token }}
  supabase-url:
    description: 'DEPRECATED. With supabase-key, full mode reads the design system directly instead of through the preset AI gateway. An anonymous key cannot read a private design system. Remove both to use the gateway (PRE-2873).'
    required: false
  supabase-key:
    description: 'DEPRECATED. Supabase anon key for the direct mode described under supabase-url.'
    required: false
  design-system-id:
    description: 'Design system UUID. Turns on full mode, which checks changed files against this design system through the preset AI gateway (GitHub OIDC with id-token: write, or preset-api-key). Must be the design system the credential is bound to; a mismatch fails the run. A fork or Dependabot pull request that has no credential (forks and Dependabot cannot read repository secrets) runs generic checks only instead of failing; any other event or PR with no credential still fails.'
    required: false
  layer-id:
    description: 'Optional layer ID for multi-layer design systems'
    required: false
  include:
    description: 'Comma-separated glob patterns for files to check'
    required: false
    default: '**/*.tsx,**/*.jsx,**/*.ts,**/*.vue,**/*.svelte'
  exclude:
    description: 'Comma-separated glob patterns for files to skip'
    required: false
    default: '**/node_modules/**'
  fail-on-errors:
    description: 'Fail the check if errors are found. Precedence: an explicit .presetrc failOnErrors wins outright; otherwise an explicit value for this input wins; otherwise .presetrc mode decides it (advisory and warn report findings without failing, enforce fails on errors); otherwise the default is true. Setting this input while .presetrc mode is also set logs a warning naming which one actually won, since mode then does nothing.'
    required: false
  composition-checks:
    description: 'Run static composition-conformance checks (forbidden Card>Card, max-depth, no-arbitrary-spacing) against changed JSX/TSX files. PRE-1484 first slice.'
    required: false
    default: 'false'
  apply-fixes:
    description: 'Auto-apply high-confidence, non-breaking design-system codemods to changed JSX/TSX files and commit them back to the PR branch. Opt-in (PRE-1933). Requires the workflow to grant `permissions: contents: write`. Skipped for fork PRs (the token cannot push to a fork branch).'
    required: false
    default: 'false'
  fail-on-warnings:
    description: 'Fail the check if warnings are found'
    required: false
    default: 'false'
  comment-on-pr:
    description: 'Post/update a PR comment with results'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Generate SARIF file for GitHub Code Scanning'
    required: false
    default: 'false'
  score-threshold:
    description: 'Minimum health score to pass (0-100, 0 = disabled)'
    required: false
    default: '0'
  regression-threshold:
    description: 'Max allowed score drop from previous snapshot (0 = disabled)'
    required: false
    default: '0'
  fail-on-new-only:
    description: 'Only fail on new violations not in the baseline (requires baseline set in DB)'
    required: false
    default: 'false'
  preset-api-key:
    description: 'Preset API key (pk_live_* or pk_test_*). Fallback for full mode and the callback, used only when OIDC is unavailable. With the preset AI GitHub App installed and `permissions: id-token: write` set on the workflow, no key is needed. See README "Authentication" for the recommended OIDC path.'
    required: false
  mcp-gateway-url:
    description: 'Override base URL for the preset AI gateway. Full mode uses <base>/mcp and the callback <base>/v1/agent-events. Defaults to the production endpoint.'
    required: false
    default: 'https://mcp.presetai.dev'
  mcp-oidc-audience:
    description: 'Audience claim requested when minting the GitHub Actions OIDC token. Must match the gateway''s configured audience (production default).'
    required: false
    default: 'https://presetai.dev'
  disable-callback:
    description: 'Disable the per-run callback regardless of available auth. Useful for one-off runs you do not want logged.'
    required: false
    default: 'false'
  allow-unchecked:
    description: 'When full mode is configured (design-system-id set) but none of your design system''s binding rules applied to a changed file, the check fails by default (PRE-2873): a run that checked nothing against your own rules is not a compliance pass. Set this to true to accept that run instead of failing it. Does not cover a gateway failure, which always fails. Has no effect in basic mode.'
    required: false
    default: 'false'

outputs:
  violations-count:
    description: 'Total number of violations found'
  errors-count:
    description: 'Number of errors found'
  warnings-count:
    description: 'Number of warnings found'
  passed:
    description: 'Whether the check passed (true/false)'
  unchecked-files:
    description: 'Files checked against zero binding design system rules (none at warn/block). Non-zero with no violations is NOT a compliance pass. In full mode, a non-zero value fails the check unless allow-unchecked is true (PRE-2873).'
  health-score:
    description: 'Overall health score (0-100, empty if not enabled)'
  health-grade:
    description: 'Health score grade (A-F, empty if not enabled)'
  health-delta:
    description: 'Score change from previous snapshot (empty if no history)'

runs:
  using: 'node20'
  main: 'dist/index.js'
